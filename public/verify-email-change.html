<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Change Verification</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f6f8;
        color: #1f2933;
      }
      .card {
        width: 100%;
        max-width: 420px;
        margin: 24px;
        padding: 40px 32px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .icon {
        font-size: 48px;
        line-height: 1;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #52606d;
        margin: 0;
      }
      .btn {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      .btn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="content">
        <div class="icon">&#8987;</div>
        <h1>Confirming your email change&hellip;</h1>
        <p>Please wait a moment.</p>
      </div>
    </div>
    <script src="./verify-email-change.js"></script>
  </body>
</html>
