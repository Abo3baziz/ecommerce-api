name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare test database
        run: npx prisma db push --url "$DATABASE_URL" --accept-data-loss

      - name: Create test environment file
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          SESSION_SECRET=$SESSION_SECRET
          CORS_ORIGIN=http://localhost:3000
          RESEND_API_KEY=$RESEND_API_KEY
          RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL
          IMAGEKIT_PUBLIC_KEY=$IMAGEKIT_PUBLIC_KEY
          IMAGEKIT_PRIVATE_KEY=$IMAGEKIT_PRIVATE_KEY
          IMAGEKIT_URL_ENDPOINT=$IMAGEKIT_URL_ENDPOINT
          EOF

      - name: Smoke boot compiled artifact
        run: |
          set -a
          source .env.test
          set +a
          export DATABASE_URL
          node dist/index.js &
          APP_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          if [ "$ok" = "1" ]; then
            echo "Compiled artifact booted and served /health"
          else
            echo "::error::Compiled artifact failed to boot or serve /health"
            exit 1
          fi

      - name: Test
        run: npm test
