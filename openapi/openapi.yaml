    get:
      tags:
      - Admin — Coupons
      summary: List coupons (admin)
      description: Lists coupons for administrators with pagination, search, status filter (ACTIVE, INACTIVE, EXPIRED, USAGE_LIMIT_REACHED), deleted inclusion and sorting. Requires ADMIN role.
      operationId: adminListCoupons
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - EXPIRED
          - USAGE_LIMIT_REACHED
      - name: include_deleted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - code
          - -code
          - discount_value
          - -discount_value
          - usage_count
          - -usage_count
          - starts_at
          - -starts_at
          - expires_at
          - -expires_at
          - created_at
          - -created_at
          default: -created_at
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Coupon'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin — Coupons
      summary: Create coupon (admin)
      description: Creates a new coupon as an administrator. Requires code (3-50 alphanumeric/dash/underscore, uppercased), discount type and value, and both total and per-user usage limits. Optional minimum order amount, maximum discount, start/expiry dates and active flag are validated (expiry must be after start, percentage ≤100).
      operationId: adminCreateCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - discount_type
              - discount_value
              - usage_limit
              - usage_limit_per_user
              properties:
                code:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Uppercased automatically; letters, numbers, dashes or underscores.
                  example: SAVE10
                discount_type:
                  type: string
                  enum:
                  - FIXED_AMOUNT
                  - PERCENTAGE
                  example: FIXED_AMOUNT
                discount_value:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100
                  description: For PERCENTAGE, cannot exceed 100.
                  example: 10
                usage_limit:
                  type: integer
                  minimum: 1
                  description: Total usage limit.
                  example: 100
                usage_limit_per_user:
                  type: integer
                  minimum: 1
                  description: Per-user usage limit.
                  example: 1
                minimum_order_amount:
                  type: number
                  minimum: 0
                  example: 50
                maximum_discount_amount:
                  type: number
                  exclusiveMinimum: 0
                  example: 20
                starts_at:
                  type: string
                  format: date-time
                  example: '2024-01-01T00:00:00.000Z'
                expires_at:
                  type: string
                  format: date-time
                  example: '2024-12-31T23:59:59.000Z'
                is_active:
                  type: boolean
                  default: true
                  example: true
            examples:
              fixed:
                value:
                  code: SAVE10
                  discount_type: FIXED_AMOUNT
                  discount_value: 10
                  usage_limit: 100
                  usage_limit_per_user: 1
              percentage:
                value:
                  code: PCT20
                  discount_type: PERCENTAGE
                  discount_value: 20
                  usage_limit: 50
                  usage_limit_per_user: 1
                  maximum_discount_amount: 30
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
