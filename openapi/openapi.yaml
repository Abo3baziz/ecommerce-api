openapi: 3.1.0
info:
  title: Ecommerce Backend API
  summary: Production-level e-commerce API (storefront + admin console).
  description: |
    Session-cookie authenticated API. Money values are decimal strings with two
    decimal places; timestamps are ISO 8601 UTC; only public IDs (`usr_`, `prd_`,
    …) are exposed.

    **Source of truth:** the hand-maintained contracts in `docs/api/**` remain
    authoritative for semantics; this file is a machine-importable projection of
    them (kept in sync manually — see openapi/README.md). Markdown wins on any
    conflict until this note is reversed.
  version: 1.0.0
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Auth
    description: Registration, login, sessions, email verification, password reset.
  - name: Users
    description: Profile management, password, email/phone change, account deletion.
  - name: Addresses
    description: Customer address book with per-type default flags.
  - name: Catalog
    description: Public product and category browsing.
  - name: Cart
    description: The customer's single, lazily created cart.
  - name: Orders
    description: Checkout and customer order history.
  - name: Reviews
    description: Product reviews with moderation-backed visibility.
security:
  - sessionCookie: []

paths:
  /auth/csrf-token:
    get:
      tags: [Auth]
      summary: Issue a CSRF token bound to the current session.
      description: |
        Required before any cookie-authenticated write when CSRF is enabled.
        Returns the token in the body and sets it in an HttpOnly cookie.
      operationId: getCsrfToken
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [csrf_token]
                    properties:
                      csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, phone_number, email, password]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                phone_number:
                  type: string
                  description: E.164 format.
                  pattern: '^\+[1-9]\d{1,14}$'
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created; session cookie set; verification email queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [public_id, email_verified]
                        properties:
                          public_id: { $ref: "#/components/schemas/UserPublicId" }
                          email_verified: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [public_id, email_verified]
                        properties:
                          public_id: { $ref: "#/components/schemas/UserPublicId" }
                          email_verified: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/session:
    get:
      tags: [Auth]
      summary: Get the current session and user summary.
      operationId: getCurrentSession
      responses:
        "200":
          description: Current session details.
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Auth]
      summary: Revoke the current session (logout).
      operationId: logout
      responses:
        "204": { description: Session revoked; cookie cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for the current user.
      operationId: listSessions
      responses:
        "200":
          description: Active sessions, newest first.
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Auth]
      summary: Revoke every other active session.
      operationId: revokeAllOtherSessions
      responses:
        "200":
          description: Remaining sessions revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/sessions/{session_public_id}:
    delete:
      tags: [Auth]
      summary: Revoke one specific session.
      operationId: revokeSession
      parameters:
        - name: session_public_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/email-verification/verify:
    post:
      tags: [Auth]
      summary: Verify a registration email token.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Email verified. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
  /auth/email-verification/resend:
    post:
      tags: [Auth]
      summary: Resend the verification email.
      operationId: resendVerificationEmail
      responses:
        "202": { description: Verification email queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Request a password reset (always returns the same message).
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted. Identical for unknown emails (no enumeration).
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the emailed OTP and receive a reset token.
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        "200": { description: Reset token issued. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset/verify:
    post:
      tags: [Auth]
      summary: Complete the reset — set a new password (revokes all sessions).
      operationId: verifyPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: Password updated; all sessions revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile.
      operationId: getCurrentUser
      responses:
        "200":
          description: Profile with verification state and role.
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update profile names.
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, minLength: 1, maxLength: 100 }
                last_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Updated profile.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Users]
      summary: Soft-delete the account (requires password).
      operationId: deleteCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deleted; sessions revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/me/password:
    patch:
      tags: [Users]
      summary: Change password (re-authenticates with the current one).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Password changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/me/email:
    post:
      tags: [Users]
      summary: Request an email change (sends verification to the new address).
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string }
      responses:
        "202": { description: Verification email queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/me/email/verify:
    post:
      tags: [Users]
      summary: Verify an email change with the emailed token.
      operationId: verifyEmailChange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Email updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
  /users/me/phone-number:
    post:
      tags: [Users]
      summary: Request a phone-number change (sends an OTP code).
      operationId: requestPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_phone_number, password]
              properties:
                new_phone_number:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  description: E.164 format.
                password: { type: string }
      responses:
        "202": { description: OTP dispatched. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/me/phone-number/verify:
    post:
      tags: [Users]
      summary: Verify a phone-number change with the OTP code.
      operationId: verifyPhoneChange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_phone_number, otp, password]
              properties:
                new_phone_number: { type: string }
                otp: { type: string }
                password: { type: string }
      responses:
        "200": { description: Phone number updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }
  /users/me/addresses:
    get:
      tags: [Addresses]
      summary: List addresses (paginated, newest first).
      operationId: listAddresses
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated address list.
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Addresses]
      summary: Create an address. First address becomes default for both types.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created address.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/me/addresses/{address_public_id}:
    get:
      tags: [Addresses]
      summary: Get one owned address.
      operationId: getAddress
      parameters:
        - $ref: "#/components/parameters/AddressPublicId"
      responses:
        "200": { description: The address. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Addresses]
      summary: Partially update an owned address.
      operationId: updateAddress
      parameters:
        - $ref: "#/components/parameters/AddressPublicId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200": { description: Updated address. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Addresses]
      summary: Soft-delete an owned address; a surviving address is promoted if it was a default.
      operationId: deleteAddress
      parameters:
        - $ref: "#/components/parameters/AddressPublicId"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products:
    get:
      tags: [Catalog]
      summary: List customer-visible products.
      operationId: listProducts
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive match on name, brand or description.
        - name: brand
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, name, -name]
            default: "-created_at"
      responses:
        "200":
          description: Paginated products; each carries a primary_image thumbnail.
        "400": { $ref: "#/components/responses/BadRequest" }
  /products/{product_public_id}:
    get:
      tags: [Catalog]
      summary: Product detail with active variants and images.
      operationId: getProduct
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductPublicId"
      responses:
        "200":
          description: |
            Product with `images` (ordered by display_order, includes
            is_primary) and `variants` (ACTIVE only) each carrying their own
            images and computed final_price.
        "404": { $ref: "#/components/responses/NotFound" }
  /categories:
    get:
      tags: [Catalog]
      summary: List categories.
      operationId: listCategories
      security: []
      responses:
        "200": { description: Paginated categories. }
  /categories/{category_public_id}:
    get:
      tags: [Catalog]
      summary: Get one category.
      operationId: getCategory
      security: []
      parameters:
        - $ref: "#/components/parameters/CategoryPublicId"
      responses:
        "200": { description: The category. }
        "404": { $ref: "#/components/responses/NotFound" }
  /categories/{category_public_id}/products:
    get:
      tags: [Catalog]
      summary: List the products of a category (paginated).
      operationId: listCategoryProducts
      security: []
      parameters:
        - $ref: "#/components/parameters/CategoryPublicId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Paginated products in the category. }
        "404": { $ref: "#/components/responses/NotFound" }

  /cart:
    get:
      tags: [Cart]
      summary: Get the current cart (created lazily on first add).
      operationId: getCart
      responses:
        "200": { description: The cart with line items and totals. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Cart not found for this user (no cart created yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      tags: [Cart]
      summary: Clear all cart lines.
      operationId: clearCart
      responses:
        "200": { description: Emptied cart. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a variant to the cart (merge-on-add per variant).
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_public_id, quantity]
              properties:
                variant_public_id: { type: string, pattern: "^var_" }
                quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: Line added or quantity merged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Insufficient stock. content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /cart/items/{variant_public_id}:
    patch:
      tags: [Cart]
      summary: Set the quantity of one cart line.
      operationId: updateCartItemQuantity
      parameters:
        - name: variant_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^var_" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated line. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Insufficient stock. content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    delete:
      tags: [Cart]
      summary: Remove one cart line.
      operationId: removeCartItem
      parameters:
        - name: variant_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^var_" }
      responses:
        "204": { description: Line removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders:
    post:
      tags: [Orders]
      summary: Place an order from the current cart.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_public_id, payment_method]
              properties:
                address_public_id: { type: string, pattern: "^adr_" }
                payment_method:
                  type: string
                  enum: [mock]
                  description: Only the mock gateway in v1.
                coupon_code: { type: string, maxLength: 50 }
                notes: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Order placed and confirmed; cart cleared.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Empty cart, inactive items, insufficient stock or invalid coupon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    get:
      tags: [Orders]
      summary: List the customer's orders (paginated).
      operationId: listMyOrders
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, processing, shipped, delivered, cancelled, returned, refunded]
        - name: sort
          in: query
          schema: { type: string, enum: [placed_at, "-placed_at", total_amount, "-total_amount"] }
      responses:
        "200": { description: Paginated order summaries. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /orders/{order_public_id}:
    get:
      tags: [Orders]
      summary: Get one owned order with items, shipment snapshot and payment.
      operationId: getOrder
      parameters:
        - name: order_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^ord_" }
      responses:
        "200": { description: Full order detail. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{product_public_id}/reviews:
    get:
      tags: [Reviews]
      summary: List approved reviews of a product with a rating summary.
      operationId: listProductReviews
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductPublicId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: rating
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, "-created_at", rating, "-rating"] }
      responses:
        "200":
          description: |
            Rating summary (`average_rating`, `total_count`) plus paginated
            approved reviews. Customer projection hides `is_approved`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reviews:
    post:
      tags: [Reviews]
      summary: Create a review (one live review per user per product).
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_public_id, rating]
              properties:
                product_public_id: { type: string, pattern: "^prd_" }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                comment: { type: string }
                images:
                  type: array
                  items:
                    type: object
                    required: [image_url]
                    properties:
                      image_url: { type: string }
                      alt_text: { type: string }
      responses:
        "201": { description: Review created (auto-approved). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Duplicate review or unfulfilled purchase requirement. content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /reviews/{review_public_id}:
    get:
      tags: [Reviews]
      summary: Get a single review.
      operationId: getReview
      security: []
      parameters:
        - name: review_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^rev_" }
      responses:
        "200": { description: The review. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Reviews]
      summary: Update the authenticated user's own review.
      operationId: updateReview
      parameters:
        - name: review_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^rev_" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                comment: { type: string }
                images:
                  type: array
                  items:
                    type: object
                    required: [image_url]
                    properties:
                      image_url: { type: string }
                      alt_text: { type: string }
      responses:
        "200": { description: Updated review; image set replaced when provided. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Reviews]
      summary: Soft-delete the authenticated user's own review.
      operationId: deleteReview
      parameters:
        - name: review_public_id
          in: path
          required: true
          schema: { type: string, pattern: "^rev_" }
      responses:
        "204": { description: Review soft-deleted; the pair becomes reviewable again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/me/reviews:
    get:
      tags: [Reviews]
      summary: List the authenticated user's own reviews (includes unapproved).
      operationId: listMyReviews
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, "-created_at", rating, "-rating"] }
      responses:
        "200":
          description: Own reviews with `is_approved` visible.
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque DB-backed session token (HttpOnly, SameSite=Lax).
  schemas:
    UserPublicId:
      type: string
      pattern: "^usr_"
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }
    AddressInput:
      type: object
      required: [recipient_name, phone_number, country, state, city, address_1]
      properties:
        recipient_name: { type: string, minLength: 1, maxLength: 100 }
        phone_number: { type: string, maxLength: 20 }
        label: { type: string, maxLength: 50 }
        country: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        address_1: { type: string, minLength: 1 }
        address_2: { type: string }
        zip_code: { type: string, maxLength: 20 }
        is_default_shipping: { type: boolean }
        is_default_billing: { type: boolean }
    ProductPrimaryImage:
      type: object
      required: [image_url]
      properties:
        image_url: { type: string }
        alt_text: { type: [string, "null"] }
  parameters:
    ProductPublicId:
      name: product_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^prd_"
    CategoryPublicId:
      name: category_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^cat_"
    AddressPublicId:
      name: address_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^adr_"
  responses:
    BadRequest:
      description: Invalid body, query or path parameter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but insufficient role, or account suspended.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource does not exist (or is deliberately hidden).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: State conflict or unique-constraint violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: Token used or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
