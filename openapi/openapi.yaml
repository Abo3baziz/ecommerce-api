  /admin/admins:
    get:
      tags:
      - Admin — Admins
      summary: List admin accounts
      description: Lists admin accounts with activity aggregates for SUPER_ADMIN, supporting pagination, search, status (ACTIVE, SUSPENDED) and activity (ACTIVE, INACTIVE based on recent login/audit within 2 days) filters, and sorting.
      operationId: adminListAdmins
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
      - name: activity
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          description: ACTIVE means recent login/audit activity within 2 days.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - last_login_at
          - -last_login_at
          default: -last_login_at
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/admins/{admin_public_id}:
