      tags: [Admin — Inventory]
      summary: Manually reserve or release reserved quantity (delta-based).
      operationId: adminReserveInventory
      parameters: [{ name: variant_public_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity_reserved]
              properties:
                quantity_reserved: { type: integer, description: Delta; negative releases. }
                reason: { type: string }
      responses:
        "200": { description: Adjusted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

