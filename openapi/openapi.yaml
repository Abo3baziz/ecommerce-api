          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: -created_at
      - name: include_deleted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        description: Include soft-deleted products. Must be "true" or "false" (string).
      responses:
        '200':
          description: Paginated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin — Products
      summary: Create product (admin)
      description: Creates a new product as an administrator. Requires a name (1-255 characters); slug is auto-generated if omitted and must match slug format, while description and brand are optional. Responds with 409 on slug conflict.
      operationId: adminCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Runner Sneaker
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  maxLength: 255
                  description: URL slug; auto-generated if omitted.
                  example: runner-sneaker
                description:
                  type: string
                  maxLength: 10000
                brand:
                  type: string
                  maxLength: 255
                  example: Nike
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
