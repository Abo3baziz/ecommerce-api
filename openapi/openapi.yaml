      - Admin — Inventory
      summary: Set absolute stock levels or apply a delta (mutually exclusive).
      description: 'Provide **either** `quantity_on_hand` (absolute) **or** `quantity_change`

        (delta, non-zero). `quantity_on_hand` and `quantity_change` are mutually

        exclusive. At least one field is required.

        '
      operationId: adminSetInventory
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: var_01H
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity_on_hand:
                  type: integer
                  minimum: 0
                  example: 100
                quantity_change:
                  type: integer
                  description: Delta; non-zero. Mutually exclusive with quantity_on_hand.
                  example: -5
                reorder_level:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  description: Null clears the reorder level.
                reason:
                  type: string
                  maxLength: 255
                  example: Cycle count correction
            examples:
              absolute:
                value:
                  quantity_on_hand: 100
                  reason: Manual set
              delta:
                value:
                  quantity_change: -5
                  reason: Damaged
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
