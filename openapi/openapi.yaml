openapi: 3.1.0
info:
  title: Ecommerce Backend API
  summary: Production-level e-commerce API (storefront + admin console).
  description: 'Session-cookie authenticated REST API. Money values are decimal strings

    (`"10.00"`, pattern `^\d{1,10}(\.\d{1,2})?$`); timestamps are ISO 8601 UTC

    (`date-time` with offset); only public IDs (`usr_`, `prd_`, …) are exposed.

    All write operations require a session cookie and, when CSRF is enabled, an

    `x-csrf-token` header.


    **Authentication:** Opaque DB-backed `session` HttpOnly cookie (SameSite=Lax).

    Obtain via `POST /auth/register` or `POST /auth/login`; revoke via

    `DELETE /auth/session`. Call `GET /auth/csrf-token` before cookie-authenticated

    writes.


    **Pagination:** `page` (1-based, default 1) + `limit` (1–100, default 20).

    Response `meta` carries `total`, `totalPages`, `hasNext`, `hasPrev`.


    **Source of truth:** the hand-maintained contracts in `docs/api/**` remain

    authoritative for semantics; this file is a machine-importable projection of

    them (kept in sync manually — see openapi/README.md). Markdown wins on any

    conflict until this note is reversed.


    **Password policy:** minimum 8 characters and must include an uppercase

    letter, a lowercase letter, a number and a special character

    (`/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}/`).

    '
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/Abo3baziz/ecommerce-api
  license:
    name: UNLICENSED
    url: https://github.com/Abo3baziz/ecommerce-api
servers:
- url: http://localhost:3000/api/v1
  description: Local development
- url: https://api.example.com/api/v1
  description: Production (override host)
tags:
- name: Auth
  description: Registration, login, sessions, email verification, password reset.
- name: Users
  description: Profile management, password, email/phone change, account deletion.
- name: Addresses
  description: Customer address book with per-type default flags.
- name: Catalog
  description: Public product and category browsing.
- name: Cart
  description: The customer's single, lazily created cart.
- name: Orders
  description: Checkout and customer order history.
- name: Reviews
  description: Product reviews with moderation-backed visibility.
- name: Admin — Products
  description: Product/variant/image management (admin).
- name: Admin — Categories
  description: Category management and product assignment (admin).
- name: Admin — Inventory
  description: Stock levels, adjustments and manual reserves (admin).
- name: Admin — Users
  description: Customer accounts, roles and suspension (admin + super_admin for role).
- name: Admin — Orders
  description: Order queue and status transitions with side effects (admin).
- name: Admin — Reviews
  description: Review moderation (admin).
- name: Admin — Coupons
  description: Coupon lifecycle and usage inspection (admin).
- name: Admin — Stats & Analytics
  description: Dashboard statistics, coupon insights and P&L expenses (super_admin unless noted).
- name: Admin — Audit
  description: Append-only audit trail (super_admin).
- name: Admin — Admins
  description: Admin account administration (super_admin).
security:
- sessionCookie: []
paths:
  /auth/csrf-token:
    get:
      tags:
      - Auth
      summary: Issue a CSRF token bound to the current session.
      description: 'Required before any cookie-authenticated write when CSRF is enabled.

        Returns the token in the body and sets it in an HttpOnly cookie.

        '
      operationId: getCsrfToken
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                    - csrf_token
                    properties:
                      csrf_token:
                        type: string
                        example: csrf_abc123
              examples:
                default:
                  value:
                    success: true
                    data:
                      csrf_token: csrf_abc123
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a customer account.
      description: Register a customer account.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - phone_number
              - email
              - password
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Doe
                phone_number:
                  type: string
                  description: E.164 format.
                  pattern: ^\+[1-9]\d{1,14}$
                  example: '+14155552671'
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: S3cure!Pass
            examples:
              default:
                value:
                  first_name: Jane
                  last_name: Doe
                  phone_number: '+14155552671'
                  email: jane@example.com
                  password: S3cure!Pass
      responses:
        '201':
          description: Account created; session cookie set; verification email queued.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - public_id
                      - email_verified
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email_verified:
                          type: boolean
              examples:
                default:
                  value:
                    success: true
                    data:
                      public_id: usr_01H
                      email_verified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password.
      description: Log in with email and password.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - public_id
                      - email_verified
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/session:
    get:
      tags:
      - Auth
      summary: Get the current session and user summary.
      description: Get the current session and user summary.
      operationId: getCurrentSession
      responses:
        '200':
          description: Current session details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email:
                          type: string
                          format: email
                        role:
                          type: string
                          enum:
                          - CUSTOMER
                          - ADMIN
                          - SUPER_ADMIN
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Auth
      summary: Revoke the current session (logout).
      description: Revoke the current session (logout).
      operationId: logout
      responses:
        '204':
          description: Session revoked; cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags:
      - Auth
      summary: List active sessions for the current user.
      description: List active sessions for the current user.
      operationId: listSessions
      responses:
        '200':
          description: Active sessions, newest first.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          public_id:
                            type: string
                            example: ses_01H
                          created_at:
                            type: string
                            format: date-time
                          expires_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Auth
      summary: Revoke every other active session.
      description: Revoke every other active session.
      operationId: revokeAllOtherSessions
      responses:
        '200':
          description: Remaining sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{session_public_id}:
    delete:
      tags:
      - Auth
      summary: Revoke one specific session.
      description: Revoke one specific session.
      operationId: revokeSession
      parameters:
      - name: session_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: ses_01H
        description: Session public ID.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/email-verification/verify:
    post:
      tags:
      - Auth
      summary: Verify a registration email token.
      description: Verify a registration email token.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  example: vrf_abc123
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      security: []
  /auth/email-verification/resend:
    post:
      tags:
      - Auth
      summary: Resend the verification email.
      description: Resend the verification email.
      operationId: resendVerificationEmail
      responses:
        '202':
          description: Verification email queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset:
    post:
      tags:
      - Auth
      summary: Request a password reset (always returns the same message).
      description: Request a password reset (always returns the same message).
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
      responses:
        '202':
          description: Accepted. Identical for unknown emails (no enumeration).
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/password-reset/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify the emailed OTP and receive a reset token.
      description: Verify the emailed OTP and receive a reset token.
      operationId: verifyPasswordResetOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                code:
                  type: string
                  pattern: ^\d{6}$
                  description: 6-digit OTP code.
                  example: '123456'
            examples:
              default:
                value:
                  email: jane@example.com
                  code: '123456'
      responses:
        '200':
          description: Reset token issued.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - token
                      properties:
                        token:
                          type: string
                          example: rst_abc123
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/password-reset/verify:
    post:
      tags:
      - Auth
      summary: Complete the reset — set a new password (revokes all sessions).
      description: Complete the reset — set a new password (revokes all sessions).
      operationId: verifyPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                  minLength: 1
                  example: rst_abc123
                new_password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: N3w!Secure
      responses:
        '204':
          description: Password updated; all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      security: []
  /users/me:
    get:
      tags:
      - Users
      summary: Get the authenticated user's profile.
      description: Get the authenticated user's profile.
      operationId: getCurrentUser
      responses:
        '200':
          description: Profile with verification state and role.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                          format: email
                        phone_number:
                          type: string
                        role:
                          type: string
                          enum:
                          - CUSTOMER
                          - ADMIN
                          - SUPER_ADMIN
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Users
      summary: Update profile names.
      description: Update profile names.
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Doe
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Users
      summary: Soft-delete the account (requires password).
      description: Soft-delete the account (requires password).
      operationId: deleteCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '204':
          description: Account deleted; sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    patch:
      tags:
      - Users
      summary: Change password (re-authenticates with the current one).
      description: Change password (re-authenticates with the current one).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  example: Old!Pass1
                new_password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: N3w!Secure1
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/email:
    post:
      tags:
      - Users
      summary: Request an email change (sends verification to the new address).
      description: Request an email change (sends verification to the new address).
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              - password
              properties:
                new_email:
                  type: string
                  format: email
                  example: new@example.com
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '202':
          description: Verification email queued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/email/verify:
    post:
      tags:
      - Users
      summary: Verify an email change with the emailed token.
      description: Requires an active session (same user who requested the change).
      operationId: verifyEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  example: vrf_abc123
      responses:
        '200':
          description: Email updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /users/me/phone-number:
    post:
      tags:
      - Users
      summary: Request a phone-number change (sends an OTP code).
      description: Request a phone-number change (sends an OTP code).
      operationId: requestPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_phone_number
              - password
              properties:
                new_phone_number:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  description: E.164 format.
                  example: '+14155552672'
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '202':
          description: OTP dispatched.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/phone-number/verify:
    post:
      tags:
      - Users
      summary: Verify a phone-number change with the OTP code.
      description: Requires an active session; the pending phone number is taken from the prior request.
      operationId: verifyPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - otp
              properties:
                otp:
                  type: string
                  pattern: ^\d{6}$
                  description: 6-digit OTP code.
                  example: '123456'
      responses:
        '200':
          description: Phone number updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/addresses:
    get:
      tags:
      - Addresses
      summary: List addresses (paginated, newest first).
      description: List addresses (paginated, newest first).
      operationId: listAddresses
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated address list.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Address'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Addresses
      summary: Create an address. First address becomes default for both types.
      description: Create an address. First address becomes default for both types.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
            examples:
              default:
                value:
                  recipient_name: Jane Doe
                  phone_number: '+14155552671'
                  country: USA
                  state: CA
                  city: San Francisco
                  address_1: 123 Market St
                  is_default_shipping: true
      responses:
        '201':
          description: Created address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/addresses/{address_public_id}:
    get:
      tags:
      - Addresses
      summary: Get one owned address.
      description: Get one owned address.
      operationId: getAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Addresses
      summary: Partially update an owned address.
      description: Partially update an owned address.
      operationId: updateAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Addresses
      summary: Soft-delete an owned address; a surviving address is promoted if it was a default.
      description: Soft-delete an owned address; a surviving address is promoted if it was a default.
      operationId: deleteAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags:
