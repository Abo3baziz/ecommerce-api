    patch:
      tags: [Admin — Inventory]
      summary: Set absolute stock levels (mutually exclusive with adjust).
      operationId: adminSetInventory
      parameters: [{ name: variant_public_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity_on_hand: { type: integer, minimum: 0 }
                reorder_level: { type: integer, minimum: 0 }
      responses:
        "200": { description: Updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
