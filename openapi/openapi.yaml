    patch: { tags: [Admin — Admins], summary: Suspend/activate or manage an admin account (super_admin)., operationId: adminManageAdmin, parameters: [{ name: admin_public_id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/admins/{admin_public_id}/suspend:
    patch: { tags: [Admin — Admins], summary: Suspend an admin account (super_admin)., operationId: adminSuspendAdmin, parameters: [{ name: admin_public_id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Suspended }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /admin/admins/{admin_public_id}/activate:
    patch: { tags: [Admin — Admins], summary: Reactivate an admin account (super_admin)., operationId: adminActivateAdmin, parameters: [{ name: admin_public_id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Activated }, "403": { $ref: "#/components/responses/Forbidden" } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque DB-backed session token (HttpOnly, SameSite=Lax).
  schemas:
    UserPublicId:
      type: string
      pattern: "^usr_"
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }
    AddressInput:
      type: object
      required: [recipient_name, phone_number, country, state, city, address_1]
      properties:
        recipient_name: { type: string, minLength: 1, maxLength: 100 }
        phone_number: { type: string, maxLength: 20 }
        label: { type: string, maxLength: 50 }
        country: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        address_1: { type: string, minLength: 1 }
        address_2: { type: string }
        zip_code: { type: string, maxLength: 20 }
        is_default_shipping: { type: boolean }
        is_default_billing: { type: boolean }
    ProductPrimaryImage:
      type: object
      required: [image_url]
      properties:
        image_url: { type: string }
        alt_text: { type: [string, "null"] }
  parameters:
    OrderPublicId:
      name: order_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ord_"
    ReviewPublicId:
      name: review_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^rev_"
    CouponPublicId:
      name: coupon_public_id
      in: path
      required: true
      schema:
        type: string
    UserPublicId:
      name: user_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^usr_"
    ProductPublicId:
      name: product_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^prd_"
    CategoryPublicId:
      name: category_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^cat_"
    AddressPublicId:
      name: address_public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^adr_"
  responses:
    BadRequest:
      description: Invalid body, query or path parameter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but insufficient role, or account suspended.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource does not exist (or is deliberately hidden).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: State conflict or unique-constraint violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: Token used or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
