        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/admins/{admin_public_id}/suspend:
    patch:
      tags:
      - Admin — Admins
      summary: Suspend admin account
      description: Suspends an admin account as a SUPER_ADMIN, preventing login. Returns 409 if already suspended and 403 if the caller lacks SUPER_ADMIN permission.
      operationId: adminSuspendAdmin
      parameters:
      - name: admin_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: usr_01H
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/admins/{admin_public_id}/activate:
    patch:
      tags:
      - Admin — Admins
      summary: Reactivate admin account
      description: Reactivates a previously suspended admin account as a SUPER_ADMIN, restoring login capability. Returns 409 if already active.
      operationId: adminActivateAdmin
      parameters:
      - name: admin_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: usr_01H
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque DB-backed session token (HttpOnly, SameSite=Lax).
  schemas:
    UserPublicId:
      type: string
      pattern: ^usr_
      example: usr_01HXYZ
    SystemSettingsSection:
      type: object
      description: 'One persisted settings section. Value shape is section-specific (see docs/api/admin/settings.md); money values are MoneyString decimals, secrets are always "[redacted]" in responses.'
      required:
      - key
      - value
      - updated_at
      properties:
        key:
          type: string
          enum:
          - general
          - commerce
          - payment
          - shipping
          - email
          - customer
          - security
          - admin_permissions
          - financial
        value:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: '#/components/schemas/UserPublicId'
    MoneyString:
      type: string
      pattern: ^(\d{1,10}(\.\d{1,2})?)$
      description: Decimal string with up to 10 integer and 2 decimal digits, >= 0.
      example: '99.99'
    DiscountString:
      type: string
      pattern: ^(\d{1,5}(\.\d{1,2})?)$
      description: Decimal string 0–100 with up to 2 decimal places.
      example: '10.00'
    DecimalString:
      type: string
      pattern: ^(\d{1,10}(\.\d{1,2})?)$
      description: Decimal string > 0 with up to 10 integer and 2 decimal digits.
      example: '1.50'
    SuccessEnvelope:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          const: true
          example: true
      description: Base success envelope; extended via allOf with `data` and, on list endpoints, `pagination`.
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          const: false
          example: false
        message:
          type: string
          example: Invalid request
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email
        requestId:
          type: string
          example: req_01H
    PaginationMeta:
      type: object
      required:
      - page
      - limit
      - total
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 20
        total:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 3
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false
    AddressInput:
      type: object
      required:
      - recipient_name
      - phone_number
      - country
      - state
      - city
      - address_1
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane Doe
        phone_number:
          type: string
          maxLength: 20
          example: '+14155552671'
        label:
          type: string
          maxLength: 50
          example: Home
        country:
          type: string
          minLength: 1
          maxLength: 100
          example: USA
        state:
          type: string
          minLength: 1
          maxLength: 100
          example: CA
        city:
          type: string
          minLength: 1
          maxLength: 100
          example: San Francisco
        address_1:
          type: string
          minLength: 1
          example: 123 Market St
        address_2:
          type:
          - string
          - 'null'
          example: Apt 4B
        zip_code:
          type: string
          maxLength: 20
          example: '94105'
        is_default_shipping:
          type: boolean
          example: false
        is_default_billing:
          type: boolean
          example: false
    Address:
      allOf:
      - $ref: '#/components/schemas/AddressInput'
      - type: object
        properties:
          public_id:
            type: string
            pattern: ^adr_
            example: adr_01H
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    ProductPrimaryImage:
      type: object
      required:
      - image_url
      properties:
        image_url:
          type: string
          format: uri
          example: https://ik.imagekit.io/demo/products/p1.jpg
        alt_text:
          type:
          - string
          - 'null'
    ProductSummary:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^prd_
          example: prd_01H
        name:
          type: string
          example: Runner Sneaker
        slug:
          type: string
          example: runner-sneaker
        brand:
          type:
          - string
          - 'null'
        primary_image:
          $ref: '#/components/schemas/ProductPrimaryImage'
        created_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^prd_
        name:
          type: string
        slug:
          type: string
        description:
          type:
          - string
          - 'null'
        brand:
          type:
          - string
          - 'null'
        images:
          type: array
          items:
            type: object
            properties:
              public_id:
                type: string
                pattern: ^pimg_
              image_url:
                type: string
                format: uri
              alt_text:
                type:
                - string
                - 'null'
              display_order:
                type: integer
              is_primary:
                type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    Variant:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^var_
          example: var_01H
        sku:
          type: string
          example: RUN-001-BLK-42
        price:
          $ref: '#/components/schemas/MoneyString'
        final_price:
          $ref: '#/components/schemas/MoneyString'
        status:
          type: string
          enum:
          - ACTIVE
          - DRAFT
          - INACTIVE
          - ARCHIVED
    Category:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^cat_
          example: cat_01H
        name:
          type: string
          example: Sneakers
        slug:
          type: string
          example: sneakers
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    Cart:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^crt_
        items:
          type: array
          items:
            type: object
            properties:
              variant_public_id:
                type: string
                pattern: ^var_
              quantity:
                type: integer
                minimum: 1
                maximum: 999
              unit_price:
                $ref: '#/components/schemas/MoneyString'
              line_total:
                $ref: '#/components/schemas/MoneyString'
        subtotal:
          $ref: '#/components/schemas/MoneyString'
        total:
          $ref: '#/components/schemas/MoneyString'
    OrderSummary:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^ord_
          example: ord_01H
        order_number:
          type: string
          example: ORD-0001
        status:
          type: string
          enum:
          - pending
          - confirmed
          - processing
          - shipped
          - delivered
          - cancelled
          - returned
          - refunded
        total_amount:
          $ref: '#/components/schemas/MoneyString'
        placed_at:
          type: string
          format: date-time
    OrderDetail:
      allOf:
      - $ref: '#/components/schemas/OrderSummary'
      - type: object
        properties:
          address:
            $ref: '#/components/schemas/Address'
          items:
            type: array
            items:
              type: object
              properties:
                variant_public_id:
                  type: string
                  pattern: ^var_
                quantity:
                  type: integer
                unit_price:
                  $ref: '#/components/schemas/MoneyString'
                line_total:
                  $ref: '#/components/schemas/MoneyString'
          payment:
            type: object
            properties:
              status:
                type: string
              method:
                type: string
          shipment:
            type:
            - object
            - 'null'
            properties:
              carrier:
                type:
                - string
                - 'null'
              tracking_number:
                type:
                - string
                - 'null'
    Review:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^rev_
          example: rev_01H
        product_public_id:
          type: string
          pattern: ^prd_
        user_public_id:
          type: string
          pattern: ^usr_
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        title:
          type:
          - string
          - 'null'
          maxLength: 255
        comment:
          type:
          - string
          - 'null'
          maxLength: 5000
        is_approved:
          type: boolean
        images:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              image_url:
                type: string
                format: uri
              alt_text:
                type:
                - string
                - 'null'
        created_at:
          type: string
          format: date-time
    Coupon:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^cpn_
          example: cpn_01H
        code:
          type: string
          example: SAVE10
        discount_type:
          type: string
          enum:
          - FIXED_AMOUNT
          - PERCENTAGE
        discount_value:
          type: number
          example: 10
        usage_limit:
          type: integer
          example: 100
        usage_limit_per_user:
          type: integer
          example: 1
        usage_count:
          type: integer
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - EXPIRED
          - USAGE_LIMIT_REACHED
        is_active:
          type: boolean
        starts_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    CouponUsage:
      type: object
      properties:
        public_id:
          type: string
        coupon_public_id:
          type: string
          pattern: ^cpn_
        user_public_id:
          type: string
          pattern: ^usr_
        order_public_id:
          type: string
          pattern: ^ord_
        discount_applied:
          $ref: '#/components/schemas/MoneyString'
        used_at:
          type: string
          format: date-time
    Expense:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^exp_
          example: exp_01H
        description:
          type: string
          maxLength: 255
        category:
          type: string
          enum:
          - RENT
          - SALARIES
          - MARKETING
          - UTILITIES
          - SHIPPING
          - SOFTWARE
          - OTHER
        amount:
          type: number
          example: 1200.5
        spent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InventoryRecord:
      type: object
      properties:
        variant_public_id:
          type: string
          pattern: ^var_
        sku:
          type: string
        product_name:
          type: string
        quantity_on_hand:
          type: integer
          minimum: 0
        quantity_reserved:
          type: integer
          minimum: 0
        quantity_available:
          type: integer
          minimum: 0
        reorder_level:
          type:
          - integer
          - 'null'
        stock_status:
          type: string
          enum:
          - IN_STOCK
          - LOW_STOCK
          - OUT_OF_STOCK
        last_stock_update:
          type:
          - string
          - 'null'
          format: date-time
    Stats:
      type: object
      properties:
        total_revenue:
          $ref: '#/components/schemas/MoneyString'
        total_orders:
          type: integer
        total_customers:
          type: integer
        period:
          type: string
          enum:
          - today
          - 7d
          - 30d
    AuditLog:
      type: object
      properties:
        public_id:
          type: string
          pattern: ^aud_
        actor:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 50
        entity_public_id:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
    ImageKitAuth:
      type: object
      required:
      - token
      - expire
      - signature
      - publicKey
      - urlEndpoint
      - folder
      properties:
        token:
          type: string
          example: abc123
        expire:
          type: integer
          example: 1714000000
        signature:
          type: string
          example: sig_abc
        publicKey:
          type: string
          example: public_xxx
        urlEndpoint:
          type: string
          format: uri
          example: https://ik.imagekit.io/demo
        folder:
          type: string
          example: /ecommerce/reviews
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    SearchParam:
      name: search
      in: query
      required: false
      description: Free-text search (trimmed).
      schema:
        type: string
        maxLength: 100
        example: sneaker
    OrderPublicId:
      name: order_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^ord_
        example: ord_01H
    ReviewPublicId:
      name: review_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^rev_
        example: rev_01H
    CouponPublicId:
      name: coupon_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^cpn_
        example: cpn_01H
    UserPublicId:
      name: user_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^usr_
        example: usr_01H
    ProductPublicId:
      name: product_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^prd_
        example: prd_01H
    CategoryPublicId:
      name: category_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^cat_
        example: cat_01H
    AddressPublicId:
      name: address_public_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^adr_
        example: adr_01H
  responses:
    BadRequest:
      description: Invalid body, query or path parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            errors:
            - field: email
              message: Invalid email
            requestId: req_01H
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication required
            requestId: req_01H
    Forbidden:
      description: Authenticated but insufficient role, or account suspended.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Forbidden
            requestId: req_01H
    NotFound:
      description: Resource does not exist (or is deliberately hidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Resource not found
            requestId: req_01H
    Conflict:
      description: State conflict or unique-constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Conflict
            requestId: req_01H
    Gone:
      description: Token used or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Token expired
            requestId: req_01H
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until rate limit resets.
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Request limit per window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Remaining requests in window.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Too many requests
            requestId: req_01H
