                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin — Products
      summary: Delete variant image (admin)
      description: Deletes a variant image as an administrator. Requires product, variant and image IDs; returns 404 if any does not exist.
      operationId: adminDeleteVariantImage
      parameters:
      - $ref: '#/components/parameters/ProductPublicId'
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: var_01H
      - name: variant_image_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: vimg_01H
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/categories:
    get:
      tags:
      - Admin — Categories
      summary: List categories (admin)
      description: Lists categories for administrators including inactive and optionally soft-deleted entries. Supports pagination, search, sorting, and filters for active status and deleted inclusion. Requires ADMIN role.
      operationId: adminListCategories
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: name
      - name: is_active
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter by active flag. Must be "true" or "false" (string).
      - name: include_deleted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin — Categories
      summary: Create category (admin)
      description: Creates a new category as an administrator. Requires a name; slug, description and active flag are optional (slug auto-generated and validated if supplied). Returns 409 on slug conflict.
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Sneakers
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  maxLength: 255
                description:
                  type: string
                  maxLength: 10000
                is_active:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/categories/{category_public_id}:
    get:
      tags:
      - Admin — Categories
      summary: Get category (admin)
      description: Returns a single category by public ID for administrators, including inactive and soft-deleted states as visible to admin. Requires ADMIN role.
      operationId: adminGetCategory
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin — Categories
      summary: Update category (admin)
      description: Updates a category's fields as an administrator. Only supplied fields are changed; null clears description. Validates name and slug format.
      operationId: adminUpdateCategory
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  maxLength: 255
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 10000
                is_active:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Admin — Categories
      summary: Delete category (admin)
      description: Soft-deletes a category as an administrator. The category is hidden from customer views but retained for referential integrity. Returns 404 if not found.
      operationId: adminDeleteCategory
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/categories/{category_public_id}/products/{product_public_id}:
    put:
      tags:
      - Admin — Categories
      summary: Assign product to category
      description: Assigns a product to a category as an administrator. The operation is idempotent — assigning an already assigned product returns 204. Returns 404 if either ID does not exist.
      operationId: adminAssignCategoryProduct
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      - $ref: '#/components/parameters/ProductPublicId'
      responses:
        '204':
          description: Assigned or already assigned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin — Categories
      summary: Remove product from category
      description: Removes a product from a category as an administrator. Succeeds with 204 even if the assignment did not exist; returns 404 if the category or product does not exist.
      operationId: adminRemoveCategoryProduct
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      - $ref: '#/components/parameters/ProductPublicId'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/inventory:
    get:
      tags:
      - Admin — Inventory
      summary: List inventory (admin)
      description: Lists inventory records for administrators with pagination, free-text search, optional stock status filter (IN_STOCK, LOW_STOCK, OUT_OF_STOCK), deleted inclusion, and sorting. Each row includes on-hand, reserved, available quantities and status.
      operationId: adminListInventory
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: stock_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - IN_STOCK
          - LOW_STOCK
          - OUT_OF_STOCK
      - name: include_deleted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - product_name
          - -product_name
          - sku
          - -sku
          - quantity_on_hand
          - -quantity_on_hand
          - quantity_available
          - -quantity_available
          - last_stock_update
          - -last_stock_update
          default: product_name
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/InventoryRecord'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin — Inventory
      summary: Create inventory record (admin)
      description: Creates an inventory record for a variant as an administrator. Requires the variant public ID and on-hand quantity (integer >=0); reorder level is optional. Returns 409 if a record already exists for the variant.
      operationId: adminCreateInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - variant_public_id
              - quantity_on_hand
              properties:
                variant_public_id:
                  type: string
                  minLength: 1
                  example: var_01H
                quantity_on_hand:
                  type: integer
                  minimum: 0
                  example: 100
                reorder_level:
                  type: integer
                  minimum: 0
                  example: 10
            examples:
              default:
                value:
                  variant_public_id: var_01H
                  quantity_on_hand: 100
                  reorder_level: 10
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/inventory/{variant_public_id}:
    get:
      tags:
      - Admin — Inventory
      summary: Get inventory for variant
      description: Returns the inventory record for a single variant, including on-hand, reserved, available quantities, reorder level and computed stock status. Requires ADMIN role.
      operationId: adminGetInventory
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^var_
          example: var_01H
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin — Inventory
      summary: Set inventory levels (admin)
      description: Sets absolute stock levels or applies a delta for a variant. Provide either quantity_on_hand (absolute) or quantity_change (non-zero delta) — they are mutually exclusive — plus optional reorder level and reason. At least one field is required.
      operationId: adminSetInventory
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: var_01H
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity_on_hand:
                  type: integer
                  minimum: 0
                  example: 100
                quantity_change:
                  type: integer
                  description: Delta; non-zero. Mutually exclusive with quantity_on_hand.
                  example: -5
                reorder_level:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  description: Null clears the reorder level.
                reason:
                  type: string
                  maxLength: 255
                  example: Cycle count correction
            examples:
              absolute:
                value:
                  quantity_on_hand: 100
                  reason: Manual set
              delta:
                value:
                  quantity_change: -5
                  reason: Damaged
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/inventory/{variant_public_id}/reserve:
    patch:
      tags:
      - Admin — Inventory
      summary: Reserve inventory (admin)
      description: Manually adjusts the reserved quantity for a variant as an administrator using a delta. Positive values reserve additional units, negative values release them. The delta must be non-zero; optional reason is stored for audit. Applies stock availability checks.
      operationId: adminReserveInventory
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: var_01H
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - change
              properties:
                change:
                  type: integer
                  description: Delta; negative releases. Non-zero.
                  example: 5
                reason:
                  type: string
                  maxLength: 255
                  example: Manual hold for photoshoot
            examples:
              default:
                value:
                  change: 5
                  reason: Manual hold
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users:
    get:
      tags:
      - Admin — Users
      summary: List users (admin)
      description: Lists customer and admin accounts for administrators with pagination, search, status filter (ACTIVE, SUSPENDED, DELETED), deleted inclusion and sorting. Requires ADMIN role; SUPER_ADMIN sees all roles.
      operationId: adminListUsers
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DELETED
      - name: include_deleted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - -name
          - email
          - -email
          - created_at
          - -created_at
          default: -created_at
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{user_public_id}:
    get:
      tags:
      - Admin — Users
      summary: Get user (admin)
      description: Returns a single user account by public ID for administrators, including verification state and status. Requires ADMIN role.
      operationId: adminGetUser
      parameters:
      - $ref: '#/components/parameters/UserPublicId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin — Users
      summary: Update user (admin)
      description: Updates a user's contact details as an administrator. Supports first name, last name, email and E.164 phone number; changing email or phone triggers reverification and creates an audit entry. Requires ADMIN role.
      operationId: adminUpdateUser
      parameters:
      - $ref: '#/components/parameters/UserPublicId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  description: E.164 format.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{user_public_id}/role:
    patch:
      tags:
      - Admin — Users
      summary: Change user role (admin)
      description: Changes a user's role between CUSTOMER and ADMIN. Requires SUPER_ADMIN; attempts to change a SUPER_ADMIN via the API are rejected (CLI-only). Returns 403 if the caller lacks permission.
      operationId: adminChangeUserRole
      parameters:
      - $ref: '#/components/parameters/UserPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - CUSTOMER
                  - ADMIN
                  example: ADMIN
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{user_public_id}/suspend:
    patch:
      tags:
      - Admin — Users
      summary: Suspend user account
      description: Suspends a user account as an administrator, preventing login and revoking all active sessions. Returns 403 if the caller lacks permission and 409 if already suspended.
      operationId: adminSuspendUser
      parameters:
      - $ref: '#/components/parameters/UserPublicId'
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{user_public_id}/activate:
    patch:
      tags:
      - Admin — Users
      summary: Activate user account
      description: Reactivates a previously suspended user account as an administrator, restoring login capability. Returns 409 if the account is already active.
      operationId: adminActivateUser
      parameters:
      - $ref: '#/components/parameters/UserPublicId'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/orders:
    get:
      tags:
      - Admin — Orders
      summary: List all orders (admin)
      description: Lists all orders for administrators with pagination, status and free-text search, optional placed date range (placed_from/to with offset) and sorting including customer name. Requires ADMIN role.
      operationId: adminListOrders
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - processing
          - shipped
          - delivered
          - cancelled
          - returned
          - refunded
      - $ref: '#/components/parameters/SearchParam'
      - name: placed_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO 8601 datetime with offset, inclusive lower bound.
        example: '2024-01-01T00:00:00.000Z'
      - name: placed_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO 8601 datetime with offset, inclusive upper bound. Must be >= placed_from.
        example: '2024-12-31T23:59:59.000Z'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - placed_at
          - -placed_at
          - order_number
          - -order_number
          - total_amount
          - -total_amount
          - customer_name
          - -customer_name
          default: -placed_at
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrderSummary'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/orders/{order_public_id}:
    get:
      tags:
      - Admin — Orders
      summary: Get order (admin)
      description: Returns full order details for administrators including line items with frozen snapshots, payment and shipment information. Requires ADMIN role.
      operationId: adminGetOrder
      parameters:
      - $ref: '#/components/parameters/OrderPublicId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin — Orders
      summary: Update order status (admin)
      description: Transitions an order to a new status as an administrator, enforcing the legal status matrix server-side. Requires status and, when transitioning to shipped, a carrier; tracking number is optional. Side effects include creating shipment, restocking inventory on cancellation, and refunding payment where applicable. Returns 409 on illegal transition.
      operationId: adminUpdateOrderStatus
      parameters:
      - $ref: '#/components/parameters/OrderPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - confirmed
                  - processing
                  - shipped
                  - delivered
                  - cancelled
                  - returned
                  - refunded
                  example: shipped
                carrier:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Required when transitioning to shipped.
                  example: DHL
                tracking_number:
                  type: string
                  maxLength: 100
                  example: TRK123456
            examples:
              ship:
                value:
                  status: shipped
                  carrier: DHL
                  tracking_number: TRK123456
              cancel:
                value:
                  status: cancelled
      responses:
        '200':
