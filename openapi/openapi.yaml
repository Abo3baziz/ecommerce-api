openapi: 3.1.0
info:
  title: Ecommerce Backend API
  summary: Production-level e-commerce API (storefront + admin console).
  description: 'Session-cookie authenticated REST API. Money values are decimal strings

    (`"10.00"`, pattern `^\d{1,10}(\.\d{1,2})?$`); timestamps are ISO 8601 UTC

    (`date-time` with offset); only public IDs (`usr_`, `prd_`, …) are exposed.

    All write operations require a session cookie and, when CSRF is enabled, an

    `x-csrf-token` header.


    **Authentication:** Opaque DB-backed `session` HttpOnly cookie (SameSite=Lax).

    Obtain via `POST /auth/register` or `POST /auth/login`; revoke via

    `DELETE /auth/session`. Call `GET /auth/csrf-token` before cookie-authenticated

    writes.


    **Pagination:** `page` (1-based, default 1) + `limit` (1–100, default 20).

    Response `pagination` carries `total`, `totalPages`, `hasNext`, `hasPrev`.


    **Source of truth:** the hand-maintained contracts in `docs/api/**` remain

    authoritative for semantics; this file is a machine-importable projection of

    them (kept in sync manually — see openapi/README.md). Markdown wins on any

    conflict until this note is reversed.


    **Password policy:** minimum 8 characters and must include an uppercase

    letter, a lowercase letter, a number and a special character

    (`/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}/`).

    '
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/Abo3baziz/ecommerce-api
  license:
    name: UNLICENSED
    url: https://github.com/Abo3baziz/ecommerce-api
servers:
- url: http://localhost:3000/api/v1
  description: Local development
- url: https://api.example.com/api/v1
  description: Production (override host)
tags:
- name: Auth
  description: Registration, login, sessions, email verification, password reset.
- name: Users
  description: Profile management, password, email/phone change, account deletion.
- name: Addresses
  description: Customer address book with per-type default flags.
- name: Catalog
  description: Public product and category browsing.
- name: Cart
  description: The customer's single, lazily created cart.
- name: Orders
  description: Checkout and customer order history.
- name: Reviews
  description: Product reviews with moderation-backed visibility.
- name: Admin — Products
  description: Product/variant/image management (admin).
- name: Admin — Categories
  description: Category management and product assignment (admin).
- name: Admin — Inventory
  description: Stock levels, adjustments and manual reserves (admin).
- name: Admin — Users
  description: Customer accounts, roles and suspension (admin + super_admin for role).
- name: Admin — Orders
  description: Order queue and status transitions with side effects (admin).
- name: Admin — Reviews
  description: Review moderation (admin).
- name: Admin — Coupons
  description: Coupon lifecycle and usage inspection (admin).
- name: Admin — Stats & Analytics
  description: Dashboard statistics, coupon insights and P&L expenses (super_admin unless noted).
- name: Admin — Audit
  description: Append-only audit trail (super_admin).
- name: Admin — Reports
  description: Financial PDF reports (P&L, expenses, revenue) by period — month/quarter/year/custom with configurable currency (super_admin, downloadable PDF or JSON preview).
- name: Admin — Admins
  description: Admin account administration (super_admin).
security:
- sessionCookie: []
paths:
  /auth/csrf-token:
    get:
      tags:
      - Auth
      summary: Get CSRF token
      description: Returns a CSRF token bound to the current session. Requires an active session cookie; the token is sent both in the response body and as an HttpOnly cookie and must be sent back in the x-csrf-token header for subsequent state-changing requests.
      operationId: getCsrfToken
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                    - csrf_token
                    properties:
                      csrf_token:
                        type: string
                        example: csrf_abc123
              examples:
                default:
                  value:
                    success: true
                    data:
                      csrf_token: csrf_abc123
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a new customer account
      description: Creates a customer account and authenticates the user by setting a session cookie. Validates first name, last name, E.164 phone number, email, and password complexity (8+ characters with uppercase, lowercase, number and special character). Queues a 24-hour verification email and returns the new user's public ID; responds with 409 if the email is already registered.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - phone_number
              - email
              - password
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Doe
                phone_number:
                  type: string
                  description: E.164 format.
                  pattern: ^\+[1-9]\d{1,14}$
                  example: '+14155552671'
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: S3cure!Pass
            examples:
              default:
                value:
                  first_name: Jane
                  last_name: Doe
                  phone_number: '+14155552671'
                  email: jane@example.com
                  password: S3cure!Pass
      responses:
        '201':
          description: Account created; session cookie set; verification email queued.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - public_id
                      - email_verified
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email_verified:
                          type: boolean
              examples:
                default:
                  value:
                    success: true
                    data:
                      public_id: usr_01H
                      email_verified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      description: Authenticates a user with email and password and sets a session cookie on success. Applies brute-force protection (lockout after 10 failed attempts for 15 minutes) and rejects suspended or deleted accounts. Returns the user's public ID and email verification status.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - public_id
                      - email_verified
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/session:
    get:
      tags:
      - Auth
      summary: Get current session
      description: Returns the authenticated user's session details and basic profile (public ID, email, role, email verification). Requires a valid session cookie; responds with 401 if the session is missing, expired, or revoked.
      operationId: getCurrentSession
      responses:
        '200':
          description: Current session details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        email:
                          type: string
                          format: email
                        role:
                          type: string
                          enum:
                          - CUSTOMER
                          - ADMIN
                          - SUPER_ADMIN
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Auth
      summary: Log out current session
      description: Revokes the current session and clears the session cookie. Requires authentication; succeeds with 204 even if the session was already revoked.
      operationId: logout
      responses:
        '204':
          description: Session revoked; cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags:
      - Auth
      summary: List active sessions
      description: Lists all active sessions for the authenticated user, ordered newest first. Each entry includes the public ID, device and IP metadata, and timestamps. Requires authentication.
      operationId: listSessions
      responses:
        '200':
          description: Active sessions, newest first.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          public_id:
                            type: string
                            example: ses_01H
                          created_at:
                            type: string
                            format: date-time
                          expires_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Auth
      summary: Revoke all other sessions
      description: Revokes every active session for the current user except the one making the request. Useful for signing out from all other devices. Requires authentication.
      operationId: revokeAllOtherSessions
      responses:
        '200':
          description: Remaining sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{session_public_id}:
    delete:
      tags:
      - Auth
      summary: Revoke a specific session
      description: Revokes a single session identified by its public ID. If the revoked session is the current one, the session cookie is cleared. Returns 404 if the session does not belong to the user or does not exist.
      operationId: revokeSession
      parameters:
      - name: session_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          example: ses_01H
        description: Session public ID.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/email-verification/verify:
    post:
      tags:
      - Auth
      summary: Verify registration email
      description: Verifies a registration email using the token sent to the user's inbox. The token is opaque and single-use with a 24-hour expiry. Returns 404 if the token is unknown and 410 if it has already been used or expired.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  example: vrf_abc123
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      security: []
  /auth/email-verification/resend:
    post:
      tags:
      - Auth
      summary: Resend verification email
      description: Resends the registration verification email to the authenticated user. Requires authentication and is rate-limited (5 per 15 minutes). Responds with 409 if the email is already verified and 202 when the email is queued.
      operationId: resendVerificationEmail
      responses:
        '202':
          description: Verification email queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset:
    post:
      tags:
      - Auth
      summary: Request password reset
      description: Starts a password reset by email. Always returns 202 with the same message to prevent account enumeration, even if the email is unknown. When the account exists, invalidates previous reset tokens, creates a 15-minute token and a 6-digit OTP, and queues an email. Rate-limited.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
      responses:
        '202':
          description: Accepted. Identical for unknown emails (no enumeration).
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/password-reset/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify password reset OTP
      description: Verifies the 6-digit OTP sent by email and, on success, issues a single-use reset token valid for 15 minutes. Applies a 60-second resend cooldown and a limit of 5 incorrect attempts before the code is invalidated. Returns 410 if the code has expired or been invalidated.
      operationId: verifyPasswordResetOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                code:
                  type: string
                  pattern: ^\d{6}$
                  description: 6-digit OTP code.
                  example: '123456'
            examples:
              default:
                value:
                  email: jane@example.com
                  code: '123456'
      responses:
        '200':
          description: Reset token issued.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - token
                      properties:
                        token:
                          type: string
                          example: rst_abc123
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/password-reset/verify:
    post:
      tags:
      - Auth
      summary: Complete password reset
      description: Completes the password reset using the reset token and a new password meeting complexity requirements. On success the password is updated and all active sessions are revoked, requiring re-login. The token is single-use and expires after 15 minutes.
      operationId: verifyPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                  minLength: 1
                  example: rst_abc123
                new_password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: N3w!Secure
      responses:
        '204':
          description: Password updated; all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      security: []
  /users/me:
    get:
      tags:
      - Users
      summary: Get current user profile
      description: Returns the authenticated user's profile including names, email, phone number, role, and email verification status. Requires authentication.
      operationId: getCurrentUser
      responses:
        '200':
          description: Profile with verification state and role.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        public_id:
                          $ref: '#/components/schemas/UserPublicId'
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                          format: email
                        phone_number:
                          type: string
                        role:
                          type: string
                          enum:
                          - CUSTOMER
                          - ADMIN
                          - SUPER_ADMIN
                        email_verified:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Users
      summary: Update profile names
      description: Updates the authenticated user's first and/or last name. At least one field must be provided; each is trimmed and limited to 1-100 characters. Returns the updated profile.
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Doe
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Users
      summary: Delete current account
      description: Soft-deletes the authenticated user's account after verifying the supplied password. Revokes all sessions and clears the session cookie. The operation is irreversible via the API and responds with 204 on success.
      operationId: deleteCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '204':
          description: Account deleted; sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    patch:
      tags:
      - Users
      summary: Change password
      description: Changes the authenticated user's password after verifying the current password. The new password must meet complexity requirements and must differ from the current one. Revokes all other sessions and is rate-limited.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  example: Old!Pass1
                new_password:
                  type: string
                  minLength: 8
                  description: Must include uppercase, lowercase, number and special character.
                  example: N3w!Secure1
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/email:
    post:
      tags:
      - Users
      summary: Request email change
      description: Starts an email change for the authenticated user. Requires the new email address and current password for re-authentication. Checks that the email is not already in use, creates a 24-hour verification token, and queues an email to the new address. Rate-limited.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              - password
              properties:
                new_email:
                  type: string
                  format: email
                  example: new@example.com
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '202':
          description: Verification email queued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/email/verify:
    post:
      tags:
      - Users
      summary: Verify email change
      description: Confirms an email change using the token sent to the new address. Requires an active session for the same user who requested the change. The token is single-use and expires after 24 hours; re-checks that the email is still available before updating.
      operationId: verifyEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
                  example: vrf_abc123
      responses:
        '200':
          description: Email updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /users/me/phone-number:
    post:
      tags:
      - Users
      summary: Request phone number change
      description: Starts a phone number change for the authenticated user. Requires the new E.164 phone number and current password. Checks uniqueness, creates a 6-digit OTP valid for 10 minutes, and dispatches it via SMS. Rate-limited.
      operationId: requestPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_phone_number
              - password
              properties:
                new_phone_number:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  description: E.164 format.
                  example: '+14155552672'
                password:
                  type: string
                  example: S3cure!Pass
      responses:
        '202':
          description: OTP dispatched.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/phone-number/verify:
    post:
      tags:
      - Users
      summary: Verify phone number change
      description: Confirms a pending phone number change using the 6-digit OTP. Requires an active session; the target number is taken from the pending request initiated by the same user. The OTP is single-use and expires after 10 minutes.
      operationId: verifyPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - otp
              properties:
                otp:
                  type: string
                  pattern: ^\d{6}$
                  description: 6-digit OTP code.
                  example: '123456'
      responses:
        '200':
          description: Phone number updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/addresses:
    get:
      tags:
      - Addresses
      summary: List saved addresses
      description: Lists the authenticated user's saved addresses with pagination (newest first). Supports page and limit parameters. Requires authentication.
      operationId: listAddresses
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated address list.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Address'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Addresses
      summary: Create an address
      description: Creates a new address for the authenticated user. Requires recipient name, phone number, country, state, city and street address; label, second line, zip code and default flags are optional. The first address is automatically set as both shipping and billing default; otherwise default flags are respected with 409 on conflict.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
            examples:
              default:
                value:
                  recipient_name: Jane Doe
                  phone_number: '+14155552671'
                  country: USA
                  state: CA
                  city: San Francisco
                  address_1: 123 Market St
                  is_default_shipping: true
      responses:
        '201':
          description: Created address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/addresses/{address_public_id}:
    get:
      tags:
      - Addresses
      summary: Get an address
      description: Returns a single address owned by the authenticated user, identified by its public ID. Responds with 404 if the address does not exist or does not belong to the user.
      operationId: getAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Addresses
      summary: Update an address
      description: Partially updates an address owned by the authenticated user. Only supplied fields are changed; default flags trigger promotion or clearing of other defaults. Applies the same validation as creation and handles unique default constraints.
      operationId: updateAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Addresses
      summary: Delete an address
      description: Soft-deletes an address owned by the authenticated user. If the deleted address was a default, the oldest remaining address is promoted to preserve a default. Returns 404 if not found.
      operationId: deleteAddress
      parameters:
      - $ref: '#/components/parameters/AddressPublicId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags:
      - Catalog
      summary: List products
      description: Lists customer-visible products with pagination, optional free-text search across name, brand and description, optional brand filter, and sorting by name, creation or update date (default newest). Only products with at least one active variant and not soft-deleted are included.
      operationId: listProducts
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: brand
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: Filter by brand (trimmed, exact match).
        example: Nike
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: -created_at
      responses:
        '200':
          description: Paginated products; each carries a primary_image thumbnail.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /products/{product_public_id}:
    get:
      tags:
      - Catalog
      summary: Get product details
      description: Returns a single product with its ordered images (including primary flag) and active variants with their images, pricing and computed final price. Only customer-visible products are returned; responds with 404 otherwise.
      operationId: getProduct
      parameters:
      - $ref: '#/components/parameters/ProductPublicId'
      responses:
        '200':
          description: 'Product with `images` (ordered by display_order, includes

            is_primary) and `variants` (ACTIVE only) each carrying their own

            images and computed final_price.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /categories:
    get:
      tags:
      - Catalog
      summary: List categories
      description: Lists customer-visible categories with pagination, optional search, and sorting by name, creation or update date (default name). Only active, non-deleted categories are included.
      operationId: listCategories
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: name
      responses:
        '200':
          description: Paginated categories.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /categories/{category_public_id}:
    get:
      tags:
      - Catalog
      summary: Get a category
      description: Returns a single customer-visible category by its public ID, including product count. Responds with 404 if the category is inactive, deleted, or does not exist.
      operationId: getCategory
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /categories/{category_public_id}/products:
    get:
      tags:
      - Catalog
      summary: List products in a category
      description: Lists customer-visible products belonging to a specific category with pagination, optional search, and sorting. The category must be customer-visible; otherwise the endpoint returns 404. Products are filtered to only those with active variants.
      operationId: listCategoryProducts
      parameters:
      - $ref: '#/components/parameters/CategoryPublicId'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: -created_at
      responses:
        '200':
          description: Paginated products in the category.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /cart:
    get:
      tags:
      - Cart
      summary: Get current cart
      description: Returns the authenticated user's cart with line items, unit prices, line totals and cart totals. The cart is created lazily on first add; if no cart exists yet the API returns 404. Requires authentication.
      operationId: getCart
      responses:
        '200':
          description: The cart with line items and totals.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart not found for this user (no cart created yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - Cart
      summary: Clear cart
      description: Removes all line items from the authenticated user's cart. If the user has no cart, responds with 404. Returns the emptied cart on success.
      operationId: clearCart
      responses:
        '200':
          description: Emptied cart.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cart/items:
    post:
      tags:
      - Cart
      summary: Add item to cart
      description: Adds a product variant to the authenticated user's cart, merging quantity if the variant is already present. Validates the variant ID and quantity (1-999, default 1) and checks available stock; responds with 409 if insufficient stock.
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - variant_public_id
              - quantity
              properties:
                variant_public_id:
                  type: string
                  minLength: 1
                  pattern: ^var_
                  example: var_01H
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 999
                  default: 1
                  example: 2
            examples:
              default:
                value:
                  variant_public_id: var_01H
                  quantity: 2
      responses:
        '201':
          description: Line added or quantity merged.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart/items/{variant_public_id}:
    patch:
      tags:
      - Cart
      summary: Update cart item quantity
      description: Sets the quantity for a specific variant already in the cart. Validates the new quantity (1-999) and checks stock availability, returning 409 if insufficient. The variant is identified by its public ID in the path.
      operationId: updateCartItemQuantity
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^var_
          example: var_01H
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 999
                  example: 3
      responses:
        '200':
          description: Updated line.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - Cart
      summary: Remove cart item
      description: Removes a single variant line from the authenticated user's cart. Identified by variant public ID in the path; returns 404 if the line is not in the cart. Responds with 204 on success.
      operationId: removeCartItem
      parameters:
      - name: variant_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^var_
          example: var_01H
      responses:
        '204':
          description: Line removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    post:
      tags:
      - Orders
      summary: Place order from cart
      description: Creates an order from the current cart in a single transaction guarded by a per-user advisory lock. Requires an owned address and payment method 'mock'; optional coupon code (uppercased) and notes are supported. Validates cart not empty, items active, and stock available; on success the cart is cleared and the confirmed order is returned. Returns 409 for empty cart, inactive items, insufficient stock or invalid coupon.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address_public_id
              - payment_method
              properties:
                address_public_id:
                  type: string
                  minLength: 1
                  pattern: ^adr_
                  example: adr_01H
                payment_method:
                  type: string
                  enum:
                  - mock
                  description: Only the mock gateway in v1.
                  example: mock
                coupon_code:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Uppercased automatically.
                  example: SAVE10
                notes:
                  type: string
                  maxLength: 1000
                  example: Leave at door
            examples:
              default:
                value:
                  address_public_id: adr_01H
                  payment_method: mock
      responses:
        '201':
          description: Order placed and confirmed; cart cleared.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Empty cart, inactive items, insufficient stock or invalid coupon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags:
      - Orders
      summary: List my orders
      description: Lists the authenticated user's orders with pagination, optional status filter, and sorting by placement date, order number or total amount (default newest). Requires authentication.
      operationId: listMyOrders
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - processing
          - shipped
          - delivered
          - cancelled
          - returned
          - refunded
        description: Filter by order status.
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - placed_at
          - -placed_at
          - order_number
          - -order_number
          - total_amount
          - -total_amount
          default: -placed_at
      responses:
        '200':
          description: Paginated order summaries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrderSummary'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{order_public_id}:
    get:
      tags:
      - Orders
      summary: Get order details
      description: Returns a single order owned by the authenticated user, including line items with frozen price and SKU snapshots, payment status and shipment snapshot. Responds with 404 if the order does not belong to the user.
      operationId: getOrder
      parameters:
      - name: order_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^ord_
          example: ord_01H
      responses:
        '200':
          description: Full order detail.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{product_public_id}/reviews:
    get:
      tags:
      - Reviews
      summary: List product reviews
      description: Lists approved reviews for a product with a rating summary (average and total count) and paginated review entries. Supports filtering by exact rating and sorting by creation date or rating. Customer view hides moderation flags; responds with 404 if the product does not exist.
      operationId: listProductReviews
      parameters:
      - $ref: '#/components/parameters/ProductPublicId'
      - $ref: '#/components/parameters/PageParam'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page (default 20, max 100).
      - name: rating
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5
        description: Filter by exact rating.
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - rating
          - -rating
          default: -created_at
      responses:
        '200':
          description: 'Rating summary (`average_rating`, `total_count`) plus paginated

            approved reviews. Customer projection hides `is_approved`.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        summary:
                          type: object
                          properties:
                            average_rating:
                              type: number
                              example: 4.2
                            total_count:
                              type: integer
                              example: 42
                        reviews:
                          type: array
                          items:
                            $ref: '#/components/schemas/Review'
                    pagination:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /reviews:
    post:
      tags:
      - Reviews
      summary: Create a product review
      description: Creates a review for a product on behalf of the authenticated user. Requires product ID and rating (1-5); title, comment and up to 5 images (ImageKit URLs) are optional. Enforces one live review per user per product; auto-approves on creation. Returns 409 on duplicate.
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product_public_id
              - rating
              properties:
                product_public_id:
                  type: string
                  minLength: 1
                  pattern: ^prd_
                  example: prd_01H
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                title:
                  type: string
                  maxLength: 255
                  example: Great product!
                comment:
                  type: string
                  maxLength: 5000
                  example: Loved it, will buy again.
                images:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required:
                    - image_url
                    properties:
                      image_url:
                        type: string
                        format: uri
                        maxLength: 2048
                        example: https://ik.imagekit.io/demo/reviews/rv1.jpg
                      alt_text:
                        type: string
                        maxLength: 255
            examples:
              default:
                value:
                  product_public_id: prd_01H
                  rating: 5
                  title: Great!
                  comment: Loved it
      responses:
        '201':
          description: Review created (auto-approved).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate review or unfulfilled purchase requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /reviews/{review_public_id}:
    get:
      tags:
      - Reviews
      summary: Get a review
      description: Returns a single review by its public ID. The endpoint is public and returns the review regardless of approval state as stored; responds with 404 if not found.
      operationId: getReview
      parameters:
      - name: review_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^rev_
          example: rev_01H
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Review'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    patch:
      tags:
      - Reviews
      summary: Update own review
      description: Updates the authenticated user's own review. At least one of rating, title, comment or images must be supplied; providing images replaces the entire image set. Null clears title or comment. Returns 403 if the review belongs to another user.
      operationId: updateReview
      parameters:
      - name: review_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^rev_
          example: rev_01H
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                  description: Null clears the title.
                comment:
                  type:
                  - string
                  - 'null'
                  maxLength: 5000
                  description: Null clears the comment.
                images:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required:
                    - image_url
                    properties:
                      image_url:
                        type: string
                        format: uri
                        maxLength: 2048
                      alt_text:
                        type: string
                        maxLength: 255
              description: At least one field is required; image set is replaced when provided.
      responses:
        '200':
          description: Updated review; image set replaced when provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Reviews
      summary: Delete own review
      description: Soft-deletes the authenticated user's own review. After deletion the user may create a new review for the same product. Returns 403 if not owned and 404 if not found, with 204 on success.
      operationId: deleteReview
      parameters:
      - name: review_public_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^rev_
          example: rev_01H
      responses:
        '204':
          description: Review soft-deleted; the pair becomes reviewable again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/reviews:
    get:
      tags:
      - Reviews
      summary: List my reviews
      description: Lists reviews authored by the authenticated user, including unapproved entries not visible publicly. Paginated and sortable by creation date or rating; exposes the approval flag.
      operationId: listMyReviews
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: sort
        in: query
        required: false
        description: Sort field. Prefix with `-` for descending.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - rating
          - -rating
          default: -created_at
      responses:
        '200':
          description: Own reviews with `is_approved` visible.
          content:
            application/json:
